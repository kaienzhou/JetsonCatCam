<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css">
<title>CatCam 登录</title>
</head>
<body class="login">
<main class="login-box">
  <img src="/icon-192.png" width="72" height="72" alt="">
  <h1>CatCam</h1>
  <p class="muted">输入访问口令</p>
  <form id="f">
    <input id="code" name="code" type="password" autocomplete="current-password" autocapitalize="none"
           autocorrect="off" spellcheck="false" placeholder="访问口令" required autofocus>
    <button class="btn primary" type="submit">进入</button>
  </form>
  <p id="msg" class="msg" role="alert"></p>
  <p class="muted small">口令在设备上执行 <code>python3 -m catcam code</code> 就能看到。</p>
</main>
<script src="/login.js"></script>
</body>
</html>
